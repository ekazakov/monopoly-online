<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harborfront Game Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="root" id="root">
  <div class="board-stage" id="boardStage"></div>
  <header class="top">
    <div class="logbar" id="logbar">
      <div class="log-filters" id="logFilters" role="group" aria-label="Filter the log" hidden></div>
      <div class="log-row">
        <div class="log" id="log" role="log" aria-label="Game log"></div>
        <button type="button" class="icon-btn log-toggle" id="logToggle" aria-expanded="false" aria-label="Expand game log"></button>
      </div>
    </div>
    <div class="top-right">
      <span class="round" id="round"></span>
      <button type="button" class="menu-btn" id="menuBtn">Menu</button>
    </div>
  </header>

  <main class="middle">
    <aside class="rail" id="rail" aria-label="Players"></aside>
    <section class="board-col" id="boardCol" aria-label="Board">
      <div class="board-msg" id="boardMsg" hidden>The 3D board needs WebGL, which this browser has turned off or does not support.</div>
      <div class="turn" id="turn" aria-label="Turn actions" role="region">
        <div class="turn-inner" id="turnInner"></div>
      </div>
    </section>
    <div class="spacer" aria-hidden="true"></div>
  </main>

  <footer class="hand-wrap" id="handWrap">
    <h2 class="hand-label" id="handLabel"></h2>
    <div class="hand" id="hand"></div>
  </footer>
</div>

<div class="handoff" id="handoff" hidden role="dialog" aria-modal="true" aria-labelledby="handoffTitle">
  <div class="handoff-card">
    <div class="handoff-stage" id="handoffStage"></div>
    <p class="eyebrow">Next on this device</p>
    <h2 id="handoffTitle"></h2>
    <p class="handoff-sub" id="handoffSub"></p>
    <button type="button" class="hf-primary big" id="handoffGo"></button>
  </div>
</div>

<div class="proto" id="proto">
  <button type="button" class="proto-toggle" id="protoToggle" aria-expanded="false" aria-controls="protoPanel">Prototype</button>
  <div class="proto-panel" id="protoPanel" hidden></div>
</div>

<div class="sr-only" aria-live="polite" id="announce"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
