<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harborfront export</title>
<style>
  body { font: 15px system-ui, -apple-system, sans-serif; margin: 24px auto; max-width: 760px; padding: 0 16px; color: #17211b; }
  #host { position: relative; width: 100%; height: 420px; background: #1d2b24; border-radius: 8px; margin: 16px 0; overflow: hidden; }
  button { font: inherit; padding: 8px 14px; margin: 4px 6px 4px 0; cursor: pointer; }
  #status { color: #555; min-height: 1.5em; }
</style>
</head>
<body>
<h1>Harborfront export</h1>
<p>Each button downloads one binary glTF (<code>.glb</code>) file. Board and houses share one coordinate system, so load the houses on top of the board.</p>
<div>
  <button data-export="board">Board</button>
  <button data-export="houses">Houses and hotels</button>
  <button data-export="cat">Cat</button>
  <button data-export="dog">Dog</button>
  <button data-export="penguin">Penguin</button>
  <button data-export="car">Car</button>
  <button data-export="all">All</button>
</div>
<div id="host"></div>
<p id="status">Loading…</p>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/export.js"></script>
</body>
</html>
