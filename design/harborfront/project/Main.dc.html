<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Harborfront Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1000px; height: 1000px; box-sizing: border-box; background: {{ground}}; font-family: 'Barlow Condensed', sans-serif; color: #17211b; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; width: 1000px; height: 1000px; box-sizing: border-box; border: 2px solid #1d2b24">

<!-- centre -->
<div style="position: absolute; left: 140px; top: 140px; width: 720px; height: 720px; border: 1px solid #1d2b24; box-sizing: border-box; overflow: hidden">
<div style="position: absolute; left: 80px; top: 80px; width: 180px; height: 120px; border: 2px dashed #3d5a4a; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); font-weight: 700; font-size: 18px; letter-spacing: 0.18em; color: #2f4a3b; text-transform: uppercase">Community Chest</div>
<div style="position: absolute; left: 460px; top: 520px; width: 180px; height: 120px; border: 2px dashed #3d5a4a; border-radius: 8px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); font-weight: 700; font-size: 18px; letter-spacing: 0.18em; color: #2f4a3b; text-transform: uppercase">Chance</div>

</div>

<!-- side strips -->
<sc-for list="{{sides}}" as="side" hint-placeholder-count="4">
<div style="{{side.style}}">
<sc-for list="{{side.cells}}" as="cell" hint-placeholder-count="9">
<div style="width: 80px; height: 140px; box-sizing: border-box; border: 1px solid #1d2b24; background: #eef4e9; display: flex; flex-direction: column; align-items: center; text-align: center">
<sc-if value="{{cell.isProperty}}" hint-placeholder-val="{{ true }}">
<div style="width: 100%; height: 30px; box-sizing: border-box; border-bottom: 1px solid #1d2b24; background: {{cell.color}}"></div>
</sc-if>
<div style="padding: 8px 4px 0; font-weight: 700; font-size: 14px; line-height: 1.05; letter-spacing: 0.03em; text-transform: uppercase">{{cell.name}}</div>
<sc-if value="{{cell.isRail}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#17211b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 8px"><rect x="9" y="6" width="22" height="22" rx="5"></rect><path d="M9 18h22"></path><circle cx="15" cy="23" r="1.2" fill="#17211b"></circle><circle cx="25" cy="23" r="1.2" fill="#17211b"></circle><path d="M13 34l4-6M27 34l-4-6"></path></svg>
</sc-if>
<sc-if value="{{cell.isUtility}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#17211b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 8px"><path d="M20 5c-5.5 0-9 3.8-9 8.5 0 3.2 1.6 5.2 3.2 7 1 1.1 1.6 2.4 1.6 3.9V26h8.4v-1.6c0-1.5.6-2.8 1.6-3.9 1.6-1.8 3.2-3.8 3.2-7C29 8.8 25.500 5 20 5z"></path><path d="M16 30h8M17.500 34h5"></path></svg>
</sc-if>
<sc-if value="{{cell.isChance}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 6px; font-weight: 700; font-size: 58px; line-height: 1; color: #c0302a">?</div>
</sc-if>
<sc-if value="{{cell.isChest}}" hint-placeholder-val="{{ false }}">
<svg width="46" height="40" viewBox="0 0 46 40" fill="none" stroke="#1f4f96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 10px"><rect x="5" y="15" width="36" height="20" rx="2"></rect><path d="M5 22h36M5 15c0-5 4-9 9-9h18c5 0 9 4 9 9"></path><rect x="20" y="19" width="6" height="7" rx="1"></rect></svg>
</sc-if>
<sc-if value="{{cell.isTax}}" hint-placeholder-val="{{ false }}">
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#17211b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-top: 8px"><path d="M20 5l13 15-13 15L7 20z"></path><path d="M7 20h26"></path></svg>
</sc-if>
<div style="margin-top: auto; padding-bottom: 8px; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 13px">{{cell.price}}</div>
</div>
</sc-for>
</div>
</sc-for>

<!-- GO -->
<div style="position: absolute; right: 0; bottom: 0; width: 140px; height: 140px; box-sizing: border-box; border: 1px solid #1d2b24; background: #eef4e9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
<div style="font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; width: 100px; line-height: 1.2">Collect $200 salary as you pass</div>
<div style="font-weight: 700; font-size: 64px; line-height: 1; color: #c8322b; letter-spacing: 0.04em; margin-top: 2px">GO</div>
<svg width="100" height="22" viewBox="0 0 100 22" fill="none" stroke="#c8322b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M96 11H8M20 3L8 11l12 8"></path></svg>
</div>

<!-- JAIL -->
<div style="position: absolute; left: 0; bottom: 0; width: 140px; height: 140px; box-sizing: border-box; border: 1px solid #1d2b24; background: #eef4e9">
<div style="position: absolute; left: 0; top: 0; width: 100px; height: 100px; box-sizing: border-box; background: #f0902f; border-right: 1px solid #1d2b24; border-bottom: 1px solid #1d2b24; display: flex; flex-direction: column; align-items: center; justify-content: center">
<svg width="56" height="48" viewBox="0 0 56 48" fill="none" stroke="#17211b" stroke-width="3" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="48" height="40" rx="2" fill="#fbe3c4"></rect><path d="M16 4v40M28 4v40M40 4v40"></path></svg>
<div style="font-weight: 700; font-size: 17px; letter-spacing: 0.1em; margin-top: 4px">IN JAIL</div>
</div>
<div style="position: absolute; left: 0; bottom: 6px; width: 100px; text-align: center; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">Just visiting</div>
</div>

<!-- FREE PARKING -->
<div style="position: absolute; left: 0; top: 0; width: 140px; height: 140px; box-sizing: border-box; border: 1px solid #1d2b24; background: #eef4e9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px">
<div style="font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase">Free</div>
<svg width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="#17211b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 28v-7c0-2 1-3 3-4l8-2 8-8h18l9 9 6 2c2 .6 3 2 3 4v6z" fill="#c8322b"></path><path d="M21 15h12v-5h-8zM37 15h11l-6-5h-5z" fill="#fff"></path><circle cx="18" cy="30" r="5" fill="#eef4e9"></circle><circle cx="48" cy="30" r="5" fill="#eef4e9"></circle></svg>
<div style="font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase">Parking</div>
</div>

<!-- GO TO JAIL -->
<div style="position: absolute; right: 0; top: 0; width: 140px; height: 140px; box-sizing: border-box; border: 1px solid #1d2b24; background: #eef4e9; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px">
<div style="font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase">Go to</div>
<svg width="64" height="54" viewBox="0 0 64 54" fill="none" stroke="#17211b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 4l22 8v16c0 12-9 19-22 23C19 47 10 40 10 28V12z" fill="#2a6fb0"></path><path d="M22 28l7 7 13-14" stroke="#fff" stroke-width="4"></path></svg>
<div style="font-weight: 700; font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase">Jail</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#cfe3cc","options":["#cfe3cc","#d9e8f2","#efe6cf","#e3d9ee"]},"$preview":{"width":1000,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const BROWN = '#8a5a3c', SKY = '#9bd4ea', PINK = '#d9569b', ORANGE = '#ee8a2c';
    const RED = '#d93a32', YELLOW = '#f2cd2e', GREEN = '#2f9e5b', NAVY = '#2459a6';
    const prop = (name, price, color) => ({ name, price: '$' + price, color, isProperty: true });
    const rail = (name) => ({ name, price: '$200', isRail: true });
    const util = (name) => ({ name, price: '$150', isUtility: true });
    const chance = () => ({ name: 'Chance', price: '', isChance: true });
    const chest = () => ({ name: 'Community Chest', price: '', isChest: true });
    const tax = (name, price) => ({ name, price: 'Pay $' + price, isTax: true });

    // each strip lists its cells in game order; row-reverse puts the first one next to the corner it follows
    const bottom = [
      prop('Driftwood Lane', 60, BROWN), chest(), prop('Kelp Court', 60, BROWN), tax('Harbor Tax', 200),
      rail('North Station'), prop('Lantern Row', 100, SKY), chance(), prop('Cobble Street', 100, SKY), prop('Saltmarsh Road', 120, SKY)
    ];
    const left = [
      prop('Orchard Way', 140, PINK), util('Power Works'), prop('Mill Street', 140, PINK), prop('Foundry Road', 160, PINK),
      rail('East Station'), prop('Copper Lane', 180, ORANGE), chest(), prop('Tinsmith Row', 180, ORANGE), prop('Market Square', 200, ORANGE)
    ];
    const top = [
      prop('Beacon Hill', 220, RED), chance(), prop('Signal Street', 220, RED), prop('Lighthouse Road', 240, RED),
      rail('South Station'), prop('Canal Street', 260, YELLOW), prop('Bridge Road', 260, YELLOW), util('Waterworks'), prop('Fountain Plaza', 280, YELLOW)
    ];
    const right = [
      prop('Pinecrest Avenue', 300, GREEN), prop('Aspen Way', 300, GREEN), chest(), prop('Cedar Heights', 320, GREEN),
      rail('West Station'), chance(), prop('Parkview', 350, NAVY), tax('Luxury Tax', 100), prop('Grand Esplanade', 400, NAVY)
    ];
    const base = 'position: absolute; width: 720px; height: 140px; display: flex; flex-direction: row-reverse; ';
    return {
      ground: this.props.ground ?? '#cfe3cc',
      sides: [
        { cells: bottom, style: base + 'left: 140px; top: 860px;' },
        { cells: left, style: base + 'left: -290px; top: 430px; transform: rotate(90deg);' },
        { cells: top, style: base + 'left: 140px; top: 0; transform: rotate(180deg);' },
        { cells: right, style: base + 'left: 570px; top: 430px; transform: rotate(-90deg);' }
      ]
    };
  }
}
</script>
</body>
</html>
