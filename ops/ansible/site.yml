---
# The full setup. It runs the server playbook, then the app playbook, then the
# ssh role.
# Run it from the repository root with: pnpm server:setup
# The first run, as root: pnpm server:setup -u root
# Run one part only with tags: pnpm server:setup --tags nginx
#
# The sequence matters. app.yml needs the user, the firewall and Docker from
# server.yml.
- name: Set up the server
  ansible.builtin.import_playbook: server.yml

- name: Set up the Harborfront app
  ansible.builtin.import_playbook: app.yml

# This play is last, and it is not in server.yml, because of the first run.
# The first run connects as root. After the ssh role closes root sign-in, a
# later play cannot connect as root.
- name: Close root sign-in
  hosts: web
  become: true
  roles:
    - { role: ssh, tags: [ssh] }
