---
# Role "ssh": closes root sign-in and password sign-in. It is the last role of
# site.yml, so a mistake here cannot stop the other roles in the middle of a run.
#
# If you are locked out, open the server console in the Kamatera panel, sign in
# as root with the password, and delete /etc/ssh/sshd_config.d/10-harborfront.conf.

# Stop before any change if the deploy user cannot sign in with the key.
# BatchMode=yes: no password question, so a missing key fails at once.
# The host is the inventory name: the alias in ~/.ssh/config, or the IP.
- name: Make sure that the deploy user can sign in with the SSH key
  ansible.builtin.command: >-
    ssh -o BatchMode=yes -o ConnectTimeout=10
    {{ ('-i ' ~ ansible_ssh_private_key_file) if ansible_ssh_private_key_file is defined else '' }}
    {{ deploy_user }}@{{ ansible_host | default(inventory_hostname) }} true
  delegate_to: localhost
  become: false
  changed_when: false

# Ubuntu reads the files in sshd_config.d/ before sshd_config, and the first
# value of a setting wins. The name starts with "10-", so it also comes before
# the "50-cloud-init.conf" file of cloud images, which can allow passwords.
- name: Close root sign-in and password sign-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-harborfront.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    # Check the full configuration with the new file before it is used.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

# Apply the change now, so the check below reads the active configuration.
- name: Reload ssh now
  ansible.builtin.meta: flush_handlers

# "sshd -T" prints the settings that sshd uses after it reads all files.
- name: Read the effective ssh settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: ssh_effective
  changed_when: false

- name: Make sure that root sign-in and password sign-in are closed
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in ssh_effective.stdout_lines"
      - "'passwordauthentication no' in ssh_effective.stdout_lines"
    fail_msg: >-
      Another sshd file sets PermitRootLogin or PasswordAuthentication first.
      Read "sshd -T" and the files in /etc/ssh/sshd_config.d/ on the server.
    quiet: true
